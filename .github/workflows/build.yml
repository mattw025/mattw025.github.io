name: Build site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.165.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository and theme
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Verify pinned versions agree
        shell: bash
        run: |
          grep -F "HUGO_VERSION = '$HUGO_VERSION'" netlify.toml
          grep -F "blogdown.hugo.version = \"$HUGO_VERSION\"" .Rprofile

      - name: Install Hugo Extended
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
            --output /tmp/hugo.deb
          sudo dpkg --install /tmp/hugo.deb
          hugo version

      - name: Build production site
        run: hugo --gc --minify --destination public

      - name: Check internal links
        run: python3 scripts/check_internal_links.py public --base-url https://mattwong.co.uk/
