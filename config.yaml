title: "Matthias Wong | Historian"
baseURL: "https://mattwong.co.uk/"
locale: "en-GB"
disableKinds: ["taxonomy", "term"]
enableEmoji: true
enableRobotsTXT: true

# Prevent blogdown from auto-detecting the submodule as a legacy Hugo theme.
# Osprey Delight is loaded exclusively through the module configuration below.
theme: []

# Load the pinned theme submodule as a local Hugo Module replacement. The
# theme's obsolete release-notify import is intentionally excluded.
module:
  replacements:
    - github.com/kdevo/osprey-delight/v5 -> osprey-delight
  imports:
    - path: github.com/kdevo/osprey-delight/v5
      ignoreImports: true
    - path: github.com/hugo-mods/icons
    - path: github.com/hugo-mods/lazyimg

params:
  author:
    name: "Matthias Meng Yan Wong"
    displayName: "Matthias Wong"

  description: "Matthias Wong is a cultural historian at NUS studying how people make sense of rupture, time, and place through archives, maps, museums, and public history."
  theme: "origin"
  themeColor: "#f7f3ee"

  hero:
    role: "Senior Tutor, Department of History"
    institution: "National University of Singapore"
    summary: "Cultural historian studying how people make sense of rupture, time, and place through archives, maps, museums, and public history."
    portrait: "prof_pic.jpg"

  brandMark: "/brand/ruptured-orbit.svg"
  opengraphImage: "social-card.png"

  enforceSinglePage: false
  copyright: true
  credit: true

  social:
    - type: "fab orcid"
      label: "ORCID"
      url: "https://orcid.org/0000-0001-7574-5451"

  feat:
    useStructuredData: true
    useTermynal: false
    googleTagManager: ""

  image:
    logo:
      resize: "300x"
      resizer: "simple"
    navLogo:
      resize: "96x"
      resizer: "simple"
    gallery:
      resize: "600x"
      resizer: "simple"

menu:
  main:
    - name: "About"
      identifier: "about"
      url: "/#about"
      weight: 10
    - name: "Research"
      identifier: "gallery"
      url: "/#research"
      weight: 20
    - name: "Publications"
      identifier: "publications"
      url: "/#publications"
      weight: 30
    - name: "Engagement"
      identifier: "projects"
      url: "/#projects"
      weight: 40
    - name: "Teaching"
      identifier: "teaching"
      url: "/#teaching"
      weight: 50

markup:
  highlight:
    noClasses: false
