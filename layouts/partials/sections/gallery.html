<div class="container research-container">
  <div class="section-heading">
    <h1>Research</h1>
    <p>How people understand time, place and disruption, from seventeenth-century print culture to historical maps and public exhibitions.</p>
  </div>
  <div class="research-grid">
    {{ range sort (where site.RegularPages "Section" "gallery") "Weight" }}
      <article class="research-card" id="{{ .File.BaseFileName }}">
        <div class="research-card__image" {{ with .Params.color }}style="--card-accent: {{ . }}"{{ end }}>
          {{ partial "sections/gallery/img" . }}
        </div>
        <div class="research-card__content">
          <h2>{{ .Title }}</h2>
          {{ .Content }}
        </div>
      </article>
    {{ end }}
  </div>
</div>
