<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}" class="no-js">
  {{ partial "head.html" . }}
  <body>
    {{ partial "body-top" . }}
    <main id="main-content">
      <section class="container standalone-page not-found">
        <h1>Page not found</h1>
        <p>The page you requested does not exist or may have moved.</p>
        <p><a href="{{ "/" | relLangURL }}">Return to the home page</a></p>
      </section>
    </main>
    {{ partial "footer.html" . }}
    {{ partial "body-bottom" . }}
  </body>
</html>
